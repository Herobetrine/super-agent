[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4
