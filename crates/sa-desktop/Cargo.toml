[package]
name = "sa-desktop"
description = "Super Agent desktop workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "super-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sa-store = { path = "../sa-store" }
sa-engine = { path = "../sa-engine" }
sa-adapters = { path = "../sa-adapters" }
sa-ext = { path = "../sa-ext" }
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
sha2.workspace = true
url = "2"
# Project file index for @ mentions (respects .gitignore).
ignore = "0.4"
# Clipboard images pasted into the composer.
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = { version = "0.17.2", default-features = false }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = "0.33.3"
egui-phosphor = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }

[dev-dependencies]
egui_kittest = { version = "0.33.3", features = ["eframe"] }
