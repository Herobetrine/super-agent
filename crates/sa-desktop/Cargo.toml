[package]
name = "sa-desktop"
description = "Super Agent desktop workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "super-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
sa-store = { path = "../sa-store" }
sa-engine = { path = "../sa-engine" }
sa-adapters = { path = "../sa-adapters" }
tokio.workspace = true
tempfile.workspace = true
rfd = { version = "0.17.2", default-features = false }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = "0.33.3"
egui-phosphor = "0.11.0"
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio-util.workspace = true
egui_kittest = { version = "0.33.3", features = ["eframe"] }
