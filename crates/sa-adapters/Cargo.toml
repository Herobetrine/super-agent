[package]
name = "sa-adapters"
description = "Super Agent harness adapters: Codex app-server, Claude Code, DeepSeek Harness, Antigravity CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
futures.workspace = true
regex = "1"
base64 = "0.22"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde_yaml = "0.9"
url = "2"
sa-engine = { path = "../sa-engine" }
sa-store = { path = "../sa-store" }
# Catalog and model-list requests to remote HTTPS endpoints. Blocking client
# run on the blocking pool; rustls (ring) with the OS trust store.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
