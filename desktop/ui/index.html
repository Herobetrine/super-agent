<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Super Agent · 项目工作台</title>
    <link rel="icon" href="mark.svg" />
    <link rel="stylesheet" href="studio.css" />
    <script defer src="common.js"></script>
    <script defer src="models.js"></script>
    <script defer src="extensions.js"></script>
    <script defer src="panels.js"></script>
    <script defer src="studio.js"></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="rail" aria-label="会话侧栏">
        <div class="brand">
          <img src="mark.svg" alt="" />
          <div><strong>Super Agent</strong><small>项目工作台</small></div>
        </div>
        <button class="new-chat" id="new-chat"><i data-icon="plus"></i>新建对话<kbd>Ctrl N</kbd></button>
        <label class="search"
          ><i data-icon="search"></i
          ><input type="search" id="history-search" placeholder="搜索对话或项目" aria-label="搜索对话或项目"
        /></label>
        <div class="rail-heading">最近对话</div>
        <nav id="history" class="history" aria-label="最近对话"></nav>
        <div class="rail-bottom">
          <button id="open-extensions"><i data-icon="layers"></i>MCP 与技能</button>
          <button id="open-models"><i data-icon="sliders"></i>模型与执行端</button>
          <button id="command-button"><i data-icon="command"></i>命令面板<kbd>Ctrl K</kbd></button>
          <div class="connection">
            <span id="connection-dot"></span><span id="connection">正在连接调度器</span>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="bar">
          <button
            class="icon-button"
            id="toggle-rail"
            aria-label="展开或收起会话侧栏"
            title="展开或收起会话侧栏"
          >
            <i data-icon="panel"></i>
          </button>
          <div class="breadcrumb"><span>工作台</span><b>／</b><strong id="chat-title">新对话</strong></div>
          <span id="state-badge" class="badge">草稿</span>
          <button class="tool-button" id="approval-shortcut" hidden>
            <i data-icon="shield"></i><span id="approval-count"></span>
          </button>
          <button class="tool-button" id="toggle-inspector" aria-expanded="false">
            <i data-icon="layout"></i>项目面板
          </button>
          <button class="icon-button" id="more" title="会话操作" aria-label="会话操作">
            <i data-icon="more"></i>
          </button>
        </header>
        <section id="auto-strip" class="auto-strip" aria-label="自动运行状态" hidden>
          <div class="auto-top">
            <strong id="auto-phase"></strong
            ><button id="auto-stop" class="danger compact"><i data-icon="stop"></i>停止自动运行</button>
          </div>
          <div id="auto-goal"></div>
          <div id="auto-learning" class="muted"></div>
        </section>
        <div class="workspace">
          <section class="conversation" aria-label="对话">
            <div id="scroll" class="scroll">
              <div class="welcome" id="welcome">
                <div class="hero-art" aria-hidden="true">
                  <span class="track one"></span><span class="track two"></span><i class="point point-one"></i
                  ><i class="point point-two"></i><i class="point point-three"></i
                  ><img src="mark.svg" alt="" />
                </div>
                <h1>今天要推进什么？</h1>
                <p>选择项目，描述目标。主控可以独立处理，也可以邀请其他 agent 协作。</p>
                <div class="suggestions">
                  <button data-template="review">
                    <i data-icon="layers"></i><strong>梳理项目</strong><small>了解结构与入口</small>
                  </button>
                  <button data-template="debug">
                    <i data-icon="code"></i><strong>定位问题</strong><small>从复现到验证</small>
                  </button>
                  <button data-template="plan">
                    <i data-icon="plan"></i><strong>讨论方案</strong><small>拆分目标与计划</small>
                  </button>
                </div>
              </div>
              <div id="feed" class="feed" aria-label="消息与协作记录"></div>
            </div>
            <section class="compose-region">
              <div id="message" class="notice" role="status" hidden>
                <span id="message-text"></span
                ><button class="icon-button" id="dismiss-message" aria-label="关闭提示">
                  <i data-icon="close"></i>
                </button>
              </div>
              <div class="composer">
                <div id="recipient" hidden class="recipient"></div>
                <div id="attachments" class="attachments" aria-label="已选上下文文件"></div>
                <textarea
                  id="editor"
                  rows="3"
                  aria-label="输入消息"
                  placeholder="描述你的目标，或输入 @ 选择项目文件…"
                  spellcheck="false"
                ></textarea>
                <div class="permission-row">
                  <label for="profile">权限</label
                  ><select id="profile" aria-label="会话权限"></select
                  ><span id="permission-hint">发送前可调整</span>
                </div>
                <div class="compose-tools">
                  <button id="project-button" class="chip">
                    <i data-icon="folder"></i><span>选择项目</span></button
                  ><button id="session-settings" class="chip">
                    <i data-icon="sliders"></i><span>主控 · DeepSeek</span></button
                  ><button
                    id="attach-button"
                    class="icon-button"
                    title="选择上下文文件"
                    aria-label="选择上下文文件"
                  >
                    <i data-icon="attach"></i></button
                  ><button id="send" class="primary" disabled><i data-icon="up"></i><span>发送</span></button>
                </div>
                <div id="file-popover" class="file-popover" role="dialog" aria-label="选择上下文文件" hidden>
                  <div class="popover-head">
                    <strong>项目文件</strong
                    ><button class="icon-button" id="files-close" aria-label="关闭文件选择">
                      <i data-icon="close"></i>
                    </button>
                  </div>
                  <input id="file-search" aria-label="查找项目文件" placeholder="搜索项目相对路径" />
                  <div id="file-options" role="listbox"></div>
                </div>
              </div>
              <div class="compose-foot">
                <span id="route-hint">跟随本机适配器配置</span
                ><span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 发送</span>
              </div>
            </section>
          </section>
          <aside id="inspector" class="inspector" aria-label="项目面板" hidden>
            <div class="inspector-head">
              <strong>项目面板</strong
              ><button class="icon-button" id="close-inspector" aria-label="关闭项目面板">
                <i data-icon="close"></i>
              </button>
            </div>
            <div id="tabs" class="tabs" role="tablist">
              <button data-tab="tasks" role="tab">协作</button><button data-tab="plan" role="tab">计划</button
              ><button data-tab="diff" role="tab">变更</button>
            </div>
            <div class="inspector-body" id="inspector-body" aria-live="off"></div>
          </aside>
        </div>
      </main>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <dialog id="palette" class="palette">
      <div class="palette-input">
        <i data-icon="search"></i
        ><input id="command-search" placeholder="搜索命令…" aria-label="搜索命令" /><button
          id="palette-close"
          class="icon-button"
          aria-label="关闭命令面板"
        >
          <i data-icon="close"></i>
        </button>
      </div>
      <div id="commands"></div>
    </dialog>
  </body>
</html>
